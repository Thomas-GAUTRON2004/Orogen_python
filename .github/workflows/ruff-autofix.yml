name: Ruff safe autofixes

on:
  pull_request:
    branches: ["port/v3.0.1"]
    paths:
      - ".github/workflows/ruff-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Apply safe Ruff fixes to changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          python_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.py' \
            | grep -v -E '^(orogen/v2/core/sphere_mesh.py|tests/test_v2_numba_kernel_coverage.py)$' || true)"
          if [ -n "$python_files" ]; then
            python -m ruff check --fix $python_files || true
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add $python_files
              git commit -m "fix(lint): apply safe Ruff autofixes"
              git push origin "HEAD:${{ github.head_ref }}"
            fi
          else
            echo "No changed Python files in the active Ruff lint baseline."
          fi
