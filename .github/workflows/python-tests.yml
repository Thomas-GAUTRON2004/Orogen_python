name: Python tests

on:
  push:
    branches:
      - main
      - "port/**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install upstream Delaunator reference dependency
        run: npm install --no-save --package-lock=false delaunator@5.0.1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python and JavaScript differential tests
        run: python -m pytest --cov=orogen.v2 --cov-report=term-missing --cov-report=xml --cov-fail-under=100
