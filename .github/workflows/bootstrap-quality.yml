name: Bootstrap Ruff formatting and uv lockfile

on:
  pull_request:
    branches: ["port/v3.0.1"]
    paths:
      - ".github/workflows/bootstrap-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Format all Python sources
        run: ruff format orogen scripts tests
      - name: Verify formatting
        run: ruff format --check orogen scripts tests
      - name: Commit formatting-only changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add orogen scripts tests
            git commit -m "style: format Python sources with Ruff"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            echo "All Python files already match Ruff formatting."
          fi

  lockfile:
    needs: format
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Resolve and validate dependency lock
        run: |
          uv lock --python 3.12
          uv lock --check
      - name: Commit lockfile separately
        shell: bash
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build: add reproducible uv dependency lock"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            echo "uv.lock is already current."
          fi
