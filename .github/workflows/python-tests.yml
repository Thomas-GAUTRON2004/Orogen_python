name: Python tests

on:
  push:
    branches:
      - main
      - "port/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show toolchain versions
        run: |
          python --version
          python -m pip --version
          node --version
          npm --version

      - name: Install upstream Delaunator reference dependency
        run: npm install --no-save --package-lock=false delaunator@5.0.1

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,speed]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Python and JavaScript differential tests
        run: |
          python -m pytest \
            --cov=orogen.v2 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
