[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orogen"
version = "3.0.1.dev0"
description = "Python port of the Orogen 3.0.1 procedural planetary simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
speed = ["numba>=0.59"]
benchmark = ["numba>=0.59"]
quality = ["ruff>=0.8", "mypy>=1.11", "xenon>=0.9", "bandit>=1.7"]

[tool.setuptools.packages.find]
include = ["orogen*"]

[tool.setuptools.package-data]
orogen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = ["E501"]
per-file-ignores = { "tests/**/*.py" = ["D"] }

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
