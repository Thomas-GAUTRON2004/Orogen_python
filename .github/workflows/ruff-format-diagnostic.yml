name: Temporary Ruff format diagnostic

on:
  push:
    branches:
      - feat/subduction-far-field-2026-11-18

permissions:
  contents: read

jobs:
  inspect-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.11.13"
      - name: Format and print exact changes
        run: |
          python -m ruff format orogen/v2/tectonics/backarc.py tests/test_v2_tectonic_backarc.py tests/test_v2_tectonic_stepper.py
          git diff -- orogen/v2/tectonics/backarc.py tests/test_v2_tectonic_backarc.py tests/test_v2_tectonic_stepper.py
