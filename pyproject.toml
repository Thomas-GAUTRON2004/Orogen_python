[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orogen"
version = "3.0.1.dev0"
description = "Python port of the Orogen 3.0.1 procedural planetary simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "shull>=0.4.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "scipy>=1.10"]
speed = ["numba>=0.59"]

[tool.setuptools.packages.find]
include = ["orogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
omit = ["orogen/v2/core/_numba_kernels.py"]
