name: shull-rust benchmark
on:
  push:
    branches: ["experiment/shull-rust"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[speed]" shull
      - run: python benchmarks/experiment_shull.py
