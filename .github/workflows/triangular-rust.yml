name: triangular-rust benchmark
on:
  push:
    branches: ["experiment/triangular-rust"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[speed]" triangular
      - run: python benchmarks/experiment_triangular.py
