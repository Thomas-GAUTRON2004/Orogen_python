name: JS vs Python benchmarks

on:
  push:
    branches:
      - "port/**"
    paths:
      - "orogen/v2/**"
      - "tests/reference/v2/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e ".[speed]"
      - name: Run paired benchmarks
        run: set -o pipefail && node benchmarks/bench.mjs | tee benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: js-python-benchmark-results
          path: benchmark-results.json
          retention-days: 30
