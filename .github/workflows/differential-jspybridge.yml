name: Differential tests (Node.js and JSPyBridge)

on:
  pull_request:
    paths:
      - ".github/workflows/differential-jspybridge.yml"
      - "tests/differential/**"
      - "tests/test_v2_seed.py"
      - "tests/reference/v2/**"
      - "orogen/v2/core/seed.py"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: differential-jspybridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: Seed tests / coverage / Node 22 / JSPyBridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and upstream reference
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "hypothesis>=6.100,<7" "javascript==1!1.2.6"

      - name: Run static seed regression tests with branch coverage
        run: |
          python -m pytest -q \
            --cov=orogen.v2.core.seed \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-seed.xml \
            tests/test_v2_seed.py

      - name: Run generated differential tests in an isolated Python process
        run: python -m pytest -q tests/differential/test_generated.py
