name: JS vs Python benchmarks

on:
  push:
    branches:
      - "port/**"
    paths:
      - "orogen/v2/**"
      - "tests/reference/v2/**"
      - "pyproject.toml"
      - "benchmarks/**"
      - "docs/JS_PYTHON_BENCHMARK.md"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    branches:
      - "port/**"
    paths:
      - "orogen/v2/**"
      - "tests/reference/v2/**"
      - "pyproject.toml"
      - "benchmarks/**"
      - "docs/JS_PYTHON_BENCHMARK.md"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_ROUNDS: "10"
      BENCH_WARMUPS: "2"
      BENCH_STEP_CELLS: "512"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package with Numba
        run: python -m pip install ".[speed]"
      - name: Run paired JavaScript, Python and Numba benchmarks
        run: node benchmarks/bench.mjs > benchmark-results.json
      - name: Generate Markdown and CSV reports
        run: python benchmarks/render_report.py benchmark-results.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Benchmark initial-world construction against the PR parent
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare the PR head with its target branch, not a hard-coded historical commit.
          baseline_sha="$PR_BASE_SHA"
          git cat-file -e "${baseline_sha}^{commit}" || {
            echo "::error::Benchmark baseline commit ${baseline_sha} is unavailable."
            exit 1
          }
          git worktree add --detach "$RUNNER_TEMP/orogen-baseline" "$baseline_sha"
          benchmark_args=(--sizes 512 1024 4096 40000 --seed 941 --warmups 1 --repeats 3)
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$RUNNER_TEMP/orogen-baseline" \
              python "$GITHUB_WORKSPACE/benchmarks/bench_initial_world.py" \
              "${benchmark_args[@]}" --label "$baseline_sha" \
              > "$RUNNER_TEMP/initial-world-baseline.json"
          )
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$GITHUB_WORKSPACE" \
              python "$GITHUB_WORKSPACE/benchmarks/bench_initial_world.py" \
              "${benchmark_args[@]}" --label "$PR_HEAD_SHA" \
              > "$RUNNER_TEMP/initial-world-head.json"
          )
          python benchmarks/compare_initial_world.py \
            --baseline "$RUNNER_TEMP/initial-world-baseline.json" \
            --head "$RUNNER_TEMP/initial-world-head.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output "$RUNNER_TEMP/initial-world-comparison.json"
      - name: Upload initial-world benchmark comparison
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: initial-world-builder-benchmarks
          path: |
            ${{ runner.temp }}/initial-world-baseline.json
            ${{ runner.temp }}/initial-world-head.json
            ${{ runner.temp }}/initial-world-comparison.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: js-python-benchmark-results
          path: |
            benchmark-results.json
            benchmark-results.md
            benchmark-results.csv
          if-no-files-found: error
          retention-days: 90
