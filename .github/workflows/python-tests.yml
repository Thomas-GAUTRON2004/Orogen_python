name: Python tests

on:
  push:
    branches:
      - main
      - "port/**"
      - "test/js-python-differential-only"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  statistical-analysis:
    name: Static and statistical analysis / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Verify dependency lockfile
        run: uv lock --check

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and analysis dependencies
        run: python -m pip install -e ".[test,speed,quality]"

      - name: Pin Ruff and coverage to compatible versions
        run: |
          python -m pip install "ruff==0.17.5"
          python -m pip install "coverage>=7.6.1,<7.17"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Show Python toolchain
        run: |
          python --version
          python -m pip --version

      - name: Scan Python package with Bandit
        run: bandit -q -r orogen

      - name: Scan repository for leaked secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="8.24.3"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "$BASE_SHA" HEAD)"
            "$RUNNER_TEMP/gitleaks" git --redact --report-format json \
              --report-path "$report" --exit-code 2 \
              --log-opts="--all ${base}..HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" dir --redact --report-format json \
              --report-path "$report" --exit-code 2 .
          fi
          scan_status=$?
          set -e
          if [ -s "$report" ]; then
            python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              findings = json.load(report_file)

          for finding in findings:
              print(
                  "::error title=Gitleaks finding::"
                  f"rule={finding.get('RuleID')} "
                  f"file={finding.get('File')} "
                  f"line={finding.get('StartLine')} "
                  f"commit={finding.get('Commit')} "
                  f"columns={finding.get('StartColumn')}-{finding.get('EndColumn')} "
                  f"fingerprint={finding.get('Fingerprint')} "
                  f"match={finding.get('Match')}"
                  f"description={finding.get('Description')}"
              )
          PY
          fi
          exit "$scan_status"

      - name: Lint all Python files with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check scripts/check_mypy_regressions.py
          python -m ruff format --check orogen scripts tests

      - name: Report current mypy diagnostics
        run: |
          python -m mypy --no-error-summary --show-error-codes orogen > "$RUNNER_TEMP/mypy-current.txt" 2>&1 || true
          python - "$RUNNER_TEMP/mypy-current.txt" <<'PY'
          import pathlib
          import sys

          diagnostics = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          errors = [line for line in diagnostics if ": error:" in line]
          print(f"Current mypy error count: {len(errors)}")
          print("\n".join(errors))
          PY

      - name: Check complexity of newly added Python files
        env:
          BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            parent_sha="$(git rev-parse "$PR_HEAD_SHA^")"
            new_python_files="$(git diff --name-only --diff-filter=A "$parent_sha" "$PR_HEAD_SHA" -- '*.py')"
          else
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="HEAD~1"
            fi
            new_python_files="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '*.py')"
          fi
          if [ -n "$new_python_files" ]; then
            xenon --max-absolute C $new_python_files
          else
            echo "No newly added Python files in this update; complexity gate not applicable."
          fi

      - name: Compare mypy diagnostics with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/orogen-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/orogen-base" && python -m mypy --no-error-summary --show-error-codes orogen) > "$RUNNER_TEMP/mypy-base.txt" 2>&1 || true
          python -m mypy --no-error-summary --show-error-codes orogen > "$RUNNER_TEMP/mypy-current.txt" 2>&1 || true
          python scripts/check_mypy_regressions.py \
            "$RUNNER_TEMP/mypy-base.txt" "$RUNNER_TEMP/mypy-current.txt"
          echo "::group::Current mypy diagnostics"
          cat "$RUNNER_TEMP/mypy-current.txt"
          echo "::endgroup::"

      - name: Audit remaining complexity hotspots
        run: |
          radon cc -s -a \
            orogen/v2/tectonics/collision.py \
            orogen/v2/tectonics/forces.py \
            orogen/v2/tectonics/ops/merge_plates.py \
            orogen/v2/tectonics/ops/rift_path.py \
            orogen/v2/tectonics/subduction_init.py
          radon mi -s \
            orogen/v2/tectonics/collision.py \
            orogen/v2/tectonics/forces.py \
            orogen/v2/tectonics/ops/merge_plates.py \
            orogen/v2/tectonics/ops/rift_path.py \
            orogen/v2/tectonics/subduction_init.py

  differential-tests:
    name: JavaScript / Python differential tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project, test, and coverage dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,speed]"
          python -m pip install "coverage>=7.6.1,<7.17" "pytest-html>=4.1,<5"

      - name: Verify upstream JavaScript source
        run: |
          test -f external/planet_heightmap_generation/v2/js/core/seed.js
          test -f external/planet_heightmap_generation/js/rng.js
          node --version
          python --version
          python -m coverage --version

      - name: Run differential tests with branch coverage
        env:
          CI: "true"
        run: |
          set +e
          python -m coverage run --branch --source=orogen \
            -m pytest -q --html=pytest-report.html --self-contained-html tests/test_v2_differential_harness.py \
            tests/test_v2_differential.py \
            tests/test_v2_differential_extended.py \
            tests/test_v2_initial_world_differential.py \
            tests/test_v2_scene_catalogue_differential.py \
            tests/test_v2_far_field_differential.py
          test_status=$?
          set -e
          # Always emit coverage data, even when a differential assertion fails.
          python -m coverage report -m
          python -m coverage xml -o coverage.xml
          python -m coverage html -d coverage-html
          exit "$test_status"

      - name: Upload differential coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-python-coverage
          path: |
            coverage.xml
            coverage-html/
            pytest-report.html
          if-no-files-found: warn
          retention-days: 14


  numba-coverage-instrumentation:
    name: Numba coverage instrumentation (Python-only infrastructure)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and coverage dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,speed]"
          python -m pip install "coverage>=7.6.1,<7.17"

      - name: Measure Numba kernel Python-body coverage
        run: |
          python -m coverage run --branch --source=orogen -m pytest -q tests/test_v2_numba_kernel_coverage.py
          python -m coverage report -m


  publish-differential-reports:
    name: Publish HTML test reports
    runs-on: ubuntu-latest
    needs: differential-tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: always() && needs.differential-tests.result != 'cancelled' && github.event_name != 'pull_request'
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download differential reports
        uses: actions/download-artifact@v4
        with:
          name: differential-python-coverage
          path: reports

      - name: Prepare browsable report site
        run: |
          mkdir -p site/docs/coverage site/coverage
          cp reports/pytest-report.html site/docs/index.html
          cp -R reports/coverage-html/. site/docs/coverage/
          # Keep the original root-level URLs available as aliases.
          cp reports/pytest-report.html site/index.html
          cp -R reports/coverage-html/. site/coverage/
          cat > site/README.txt <<'EOF'
          Pytest report: /docs/
          Python coverage report: /docs/coverage/
          Root aliases: / and /coverage/
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
