name: ckdtree-sphere-index benchmark
on:
  push:
    branches: ["experiment/ckdtree-sphere-index"]
  pull_request:
    branches: ["port/v3.0.1"]
    paths:
      - ".github/workflows/ckdtree-sphere-index.yml"
      - "benchmarks/bench_ckdtree_production.py"
      - "orogen/**"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[benchmark]"
      - run: python benchmarks/bench_ckdtree_production.py
