name: shull production pipeline benchmark

on:
  push:
    branches:
      - "port/**"
  pull_request:
    paths:
      - "orogen/v2/core/sphere_mesh.py"
      - "orogen/v2/core/sphere_index.py"
      - "benchmarks/bench_shull_pipeline.py"
      - "pyproject.toml"
      - ".github/workflows/shull-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[benchmark]"
      - name: Compare triangulation and mesh pipeline
        run: /usr/bin/time -v python benchmarks/bench_shull_pipeline.py
