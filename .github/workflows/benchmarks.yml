name: JS vs Python benchmarks

on:
  push:
    branches:
      - "port/**"
    paths:
      - "orogen/v2/**"
      - "tests/reference/v2/**"
      - "pyproject.toml"
      - "benchmarks/**"
      - "docs/JS_PYTHON_BENCHMARK.md"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    branches:
      - "port/**"
    paths:
      - "orogen/v2/**"
      - "tests/reference/v2/**"
      - "pyproject.toml"
      - "benchmarks/**"
      - "docs/JS_PYTHON_BENCHMARK.md"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_ROUNDS: "10"
      BENCH_WARMUPS: "2"
      BENCH_STEP_CELLS: "512"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package with Numba
        run: python -m pip install ".[speed]"
      - name: Run paired JavaScript, Python and Numba benchmarks
        run: node benchmarks/bench.mjs > benchmark-results.json
      - name: Benchmark initial-world construction against the PR base when available
        if: github.event_name == 'pull_request'
        id: initial-world
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          benchmark_args=(--sizes 512 1024 4096 40000 --seed 941 --warmups 1 --repeats 3)
          baseline_sha="$PR_BASE_SHA"
          git cat-file -e "${baseline_sha}^{commit}" || {
            echo "::error::Benchmark base commit ${baseline_sha} is unavailable."
            exit 1
          }
          git worktree add --detach "$RUNNER_TEMP/orogen-baseline" "$baseline_sha"

          # This constructor may be introduced by the PR itself. In that case
          # the base revision has no equivalent callable to compare against.
          if [ ! -f "$RUNNER_TEMP/orogen-baseline/orogen/v2/tectonics/initial_world.py" ]; then
            echo "baseline_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The PR base has no initial-world builder; recording the PR-head benchmark without claiming an A/B comparison."
            (
              cd "$RUNNER_TEMP"
              PYTHONPATH="$GITHUB_WORKSPACE" \
                python "$GITHUB_WORKSPACE/benchmarks/bench_initial_world.py" \
                "${benchmark_args[@]}" --label "$PR_HEAD_SHA" \
                > "$RUNNER_TEMP/initial-world-head.json"
            )
            {
              echo "### Initial-world construction benchmark"
              echo
              echo "The PR base $baseline_sha does not contain orogen/v2/tectonics/initial_world.py. A before/after comparison is therefore not applicable. The PR-head measurements are attached as an artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "baseline_available=true" >> "$GITHUB_OUTPUT"
            (
              cd "$RUNNER_TEMP"
              PYTHONPATH="$RUNNER_TEMP/orogen-baseline" \
                python "$GITHUB_WORKSPACE/benchmarks/bench_initial_world.py" \
                "${benchmark_args[@]}" --label "$baseline_sha" \
                > "$RUNNER_TEMP/initial-world-baseline.json"
            )
            (
              cd "$RUNNER_TEMP"
              PYTHONPATH="$GITHUB_WORKSPACE" \
                python "$GITHUB_WORKSPACE/benchmarks/bench_initial_world.py" \
                "${benchmark_args[@]}" --label "$PR_HEAD_SHA" \
                > "$RUNNER_TEMP/initial-world-head.json"
            )
            python benchmarks/compare_initial_world.py \
              --baseline "$RUNNER_TEMP/initial-world-baseline.json" \
              --head "$RUNNER_TEMP/initial-world-head.json" \
              --output "$RUNNER_TEMP/initial-world-comparison.json"
          fi
      - name: Upload initial-world benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: initial-world-builder-benchmarks
          path: |
            ${{ runner.temp }}/initial-world-head.json
            ${{ runner.temp }}/initial-world-baseline.json
            ${{ runner.temp }}/initial-world-comparison.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate Markdown and CSV reports
        env:
          INITIAL_WORLD_BASELINE_AVAILABLE: ${{ steps.initial-world.outputs.baseline_available }}
        run: |
          set -euo pipefail
          initial_world_args=()
          if [ -f "$RUNNER_TEMP/initial-world-head.json" ]; then
            initial_world_args+=(--initial-world-head "$RUNNER_TEMP/initial-world-head.json")
            if [ "$INITIAL_WORLD_BASELINE_AVAILABLE" = "true" ] && [ -f "$RUNNER_TEMP/initial-world-baseline.json" ]; then
              initial_world_args+=(--initial-world-baseline "$RUNNER_TEMP/initial-world-baseline.json")
            fi
          fi
          python benchmarks/render_report.py benchmark-results.json --summary "$GITHUB_STEP_SUMMARY" "${initial_world_args[@]}"
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: js-python-benchmark-results
          path: |
            benchmark-results.json
            benchmark-results.md
            benchmark-results.csv
          if-no-files-found: error
          retention-days: 90
