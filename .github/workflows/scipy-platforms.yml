name: SciPy sphere-mesh compatibility

on:
  push:
    branches:
      - "port/**"
  pull_request:
    paths:
      - "orogen/v2/core/sphere_mesh.py"
      - "tests/test_v2_sphere_mesh.py"
      - "pyproject.toml"
      - ".github/workflows/scipy-platforms.yml"
  workflow_dispatch:

jobs:
  sphere-mesh:
    name: sphere-mesh (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install Orogen and test dependencies
        run: python -m pip install -v -e ".[test]"
      - name: Verify installed SciPy backend
        run: |
          python -m pip check
          python -c "import numpy, scipy; from scipy.spatial import Delaunay; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('Delaunay', Delaunay)"
      - name: Test production spherical mesh backend
        run: python -m pytest -vv --tb=long tests/test_v2_sphere_mesh.py
