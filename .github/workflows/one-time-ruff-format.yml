name: one-time Ruff formatting pass
on:
  push:
    branches:
      - quality/phase-1-refactor-2026-11-18
    paths:
      - .github/workflows/one-time-ruff-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Format the eight CI-reported files
        run: |
          ruff format \
            orogen/v2/tectonics/crust.py \
            orogen/v2/tectonics/ops/merge_plates.py \
            tests/test_v2_differential_extended.py \
            tests/test_v2_sphere_geometry_batch.py \
            tests/test_v2_sphere_mesh_differential.py \
            tests/test_v2_tectonic_coverage.py \
            tests/test_v2_tectonic_orogeny.py \
            tests/test_v2_tectonic_subduction_init.py
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-ruff-format.yml
          git add \
            orogen/v2/tectonics/crust.py \
            orogen/v2/tectonics/ops/merge_plates.py \
            tests/test_v2_differential_extended.py \
            tests/test_v2_sphere_geometry_batch.py \
            tests/test_v2_sphere_mesh_differential.py \
            tests/test_v2_tectonic_coverage.py \
            tests/test_v2_tectonic_orogeny.py \
            tests/test_v2_tectonic_subduction_init.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff formatting to remaining files"
            git push
          fi
